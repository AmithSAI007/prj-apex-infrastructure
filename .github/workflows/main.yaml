name: INFRASTRUCTURE-PROVISIONING
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/main.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/main.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: "1.1.7"

jobs:
  determine_environment:
    name: "Determine Environment"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.get_env.outputs.environment }}
      dir: ${{ steps.get_env.outputs.dir }}
    steps:
      - id: get_env
        name: Set environment for this workflow run
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "dir=./terraform/environments/development" >> $GITHUB_OUTPUT
          else
            ENVIRONMENT="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'development') }}"
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "dir=./terraform/environments/$ENVIRONMENT" >> $GITHUB_OUTPUT
          fi

  upload_terraform_config:
    name: "Upload Terraform Configuration"
    runs-on: ubuntu-latest
    needs: determine_environment
    steps:
      - name: Create Terraform Config
        run: |
          cat <<EOF > deploy.tfvars.json
          {
            "deployment_timestamp": "$(date +%s)",
            "app_version": "${{ github.sha }}"
          }
          EOF

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: terraform-config
          path: deploy.tfvars.json
          retention-days: 1

  call-reusable-terraform:
    name: "Execute Terraform Core Logic"
    needs: [determine_environment, upload_terraform_config]
    uses: ./.github/workflows/reusable-terraform-core.yaml
    with:
      environment: ${{ needs.determine_environment.outputs.environment }}
      terraform_directory: ${{ needs.determine_environment.outputs.dir }}
      is_pull_request: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
