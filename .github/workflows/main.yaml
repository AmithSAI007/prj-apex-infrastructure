name: INFRASTRUCTURE-PROVISIONING
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/main.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/main.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: "1.1.7"

jobs:
  determine_environment:
    name: "Determine Environment"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.get_env.outputs.environment }}
      dir: ${{ steps.get_env.outputs.dir }}
    steps:
      - id: get_env
        name: Set environment for this workflow run
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "dir=./terraform/environments/development" >> $GITHUB_OUTPUT
          else
            ENVIRONMENT="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'development') }}"
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "dir=./terraform/environments/$ENVIRONMENT" >> $GITHUB_OUTPUT
          fi

  prepare-terraform-vars:
    name: "Prepare Terraform Variables"
    environment: ${{ needs.determine_environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: determine_environment
    outputs:
      tf_vars_json: ${{ steps.build_json.outputs.json }}

    steps:
      - name: "Build Terraform Vars JSON"
        id: build_json
        run: |
          JSON_STRING=$(jq -n \
            --arg project_id "${{ secrets.PROJECT_ID }}" \
            --arg project_region "${{ secrets.PROJECT_REGION }}" \
            '{project_id: $project_id, project_region: $project_region}')

          echo "json<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON_STRING" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  call-reusable-terraform:
    name: "Execute Terraform Core Logic"
    needs: [determine_environment, prepare-terraform-vars]
    uses: ./.github/workflows/reusable-terraform-core.yaml
    with:
      environment: ${{ needs.determine_environment.outputs.environment }}
      terraform_directory: ${{ needs.determine_environment.outputs.dir }}
      is_pull_request: ${{ github.event_name == 'pull_request' }}
      terraform_vars_json: ${{ needs.prepare-terraform-vars.outputs.tf_vars_json }}
    secrets: inherit
