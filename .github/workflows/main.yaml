name: INFRASTRUCTURE-PROVISIONING
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure-provisioning.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure-provisioning.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TF_IN_AUTOMATION: true
  TERRAFORM_VERSION: "1.1.7"

jobs:
  determine_environment:
    name: "Determine Environment"
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.get_env.outputs.environment }}
      dir: ${{ steps.get_env.outputs.dir }}
    steps:
      - id: get_env
        name: Set environment output
        run: |
          # For PRs, we always target 'development'
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "dir=./terraform/environments/development" >> $GITHUB_OUTPUT
          # For pushes or dispatches, use the branch name or input
          else
            ENVIRONMENT="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'development') }}"
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "dir=./terraform/environments/$ENVIRONMENT" >> $GITHUB_OUTPUT
          fi

  terraform-validation:
    name: "Terraform Validation"
    needs: determine_environment
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        run: terraform validate

  terraform-plan:
    name: "Terraform Plan"
    needs: determine_environment
    runs-on: ubuntu-24.04
    environment: ${{ needs.determine_environment.outputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        env:
          # The secret names are now generic.
          TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
          TF_VAR_project_region: ${{ secrets.PROJECT_REGION }}
        run: |
          set -o pipefail
          terraform plan -input=false -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true # Allow plan to fail to post comment

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ needs.determine_environment.outputs.dir }}/plan.txt', 'utf8');
            const outcome = '${{ steps.plan.outcome }}' == 'success' ? 'Succeeded' : 'Failed';
            const comment = `#### Terraform Plan: \`${{ steps.plan.exit_code }}\` (${outcome})

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${plan.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure' || steps.plan.exit_code == '1'
        run: exit 1

  terraform-apply:
    name: "Terraform Apply"
    if: github.event_name != 'pull_request' # Only run apply on merge to main/develop, or dispatch
    needs: [determine_environment, terraform-plan]
    runs-on: ubuntu-24.04
    environment: ${{ needs.determine_environment.outputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ needs.determine_environment.outputs.dir }}
        env:
          TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
          TF_VAR_project_region: ${{ secrets.PROJECT_REGION }}
        run: terraform apply -input=false -auto-approve
